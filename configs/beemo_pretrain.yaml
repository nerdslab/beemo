# joint pretraining: neural sessions + behavior-only sessions
defaults:
  - base
  - model: backbone.yaml
  - data: beemo_co.yaml
  - trainer: beemo
  - _self_

model:
  args:
    num_neural_sessions: 1000  # sessions with spikes, rest are behavior-only. vary for scaling study

batch_size: 256
num_epochs: 100
